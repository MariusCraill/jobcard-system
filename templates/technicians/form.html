{% extends "base.html" %}
{% block page_title %}{{ 'Edit Technician' if technician else 'New Technician' }}{% endblock %}
{% block title %}{{ app_settings.company_name }} - {{ 'Edit' if technician else 'New' }} Technician{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <form method="POST" action="{{ url_for('technicians.edit_technician', tech_id=technician.id) if technician else url_for('technicians.new_technician') }}">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label required">Employee Code</label>
                    <input type="text" name="employee_code" class="form-control" required value="{{ technician.employee_code if technician else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label required">Full Name</label>
                    <input type="text" name="name" class="form-control" required value="{{ technician.name if technician else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Role</label>
                    <input type="text" name="role" class="form-control" value="{{ technician.role if technician else 'Technician' }}">
                </div>
            </div>
            <div class="row g-3 mt-2">
                <div class="col-md-4">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ technician.email if technician else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" class="form-control" value="{{ technician.phone if technician else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Mobile</label>
                    <input type="text" name="mobile" class="form-control" value="{{ technician.mobile if technician else '' }}">
                </div>
            </div>
            <div class="row g-3 mt-2">
                <div class="col-md-4">
                    <label class="form-label">WhatsApp Number</label>
                    <input type="text" name="whatsapp" class="form-control" value="{{ technician.whatsapp if technician else '' }}" placeholder="+27123456789">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Max Concurrent Jobs</label>
                    <input type="number" name="max_jobcards" class="form-control" value="{{ technician.max_jobcards if technician else '5' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Hourly Rate (R)</label>
                    <input type="number" name="hourly_rate" class="form-control" step="0.01" value="{{ technician.hourly_rate if technician else '0' }}">
                </div>
            </div>
            <div class="mt-3">
                <label class="form-label">Specialties</label>
                <textarea name="specialties" class="form-control" rows="2" placeholder="e.g. CCTV, Access Control, Networking">{{ technician.specialties if technician else '' }}</textarea>
            </div>
            <div class="mt-3">
                <label class="form-label">Notes</label>
                <textarea name="notes" class="form-control" rows="3">{{ technician.notes if technician else '' }}</textarea>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> {{ 'Update' if technician else 'Create' }} Technician</button>
                <a href="{{ url_for('technicians.list_technicians') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

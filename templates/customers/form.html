{% extends "base.html" %}
{% block page_title %}{{ 'Edit Customer' if customer else 'New Customer' }}{% endblock %}
{% block title %}{{ app_settings.company_name }} - {{ 'Edit' if customer else 'New' }} Customer{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <form method="POST" action="{{ url_for('customers.edit_customer', customer_id=customer.id) if customer else url_for('customers.new_customer') }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label required">Name</label>
                    <input type="text" name="name" class="form-control" required value="{{ customer.name if customer else '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Company</label>
                    <input type="text" name="company" class="form-control" value="{{ customer.company if customer else '' }}">
                </div>
            </div>
            <div class="row g-3 mt-2">
                <div class="col-md-4">
                    <label class="form-label">Contact Person</label>
                    <input type="text" name="contact_person" class="form-control" value="{{ customer.contact_person if customer else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ customer.email if customer else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" class="form-control" value="{{ customer.phone if customer else '' }}">
                </div>
            </div>
            <div class="row g-3 mt-2">
                <div class="col-md-4">
                    <label class="form-label">Alt Phone</label>
                    <input type="text" name="alt_phone" class="form-control" value="{{ customer.alt_phone if customer else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">City</label>
                    <input type="text" name="city" class="form-control" value="{{ customer.city if customer else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Province</label>
                    <input type="text" name="province" class="form-control" value="{{ customer.province if customer else '' }}">
                </div>
            </div>
            <div class="row g-3 mt-2">
                <div class="col-md-4">
                    <label class="form-label">Postal Code</label>
                    <input type="text" name="postal_code" class="form-control" value="{{ customer.postal_code if customer else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Country</label>
                    <input type="text" name="country" class="form-control" value="{{ customer.country if customer else 'South Africa' }}">
                </div>
            </div>
            <div class="mt-3">
                <label class="form-label">Address</label>
                <textarea name="address" class="form-control" rows="2">{{ customer.address if customer else '' }}</textarea>
            </div>
            <div class="mt-3">
                <label class="form-label">Notes</label>
                <textarea name="notes" class="form-control" rows="3">{{ customer.notes if customer else '' }}</textarea>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> {{ 'Update' if customer else 'Create' }} Customer</button>
                <a href="{{ url_for('customers.list_customers') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

# Deploy this blueprint on Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: jobcard-system
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 60 wsgi:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: jobcard-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: UPLOAD_FOLDER
        value: "/var/data/uploads"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: jobcard-db
    plan: free
